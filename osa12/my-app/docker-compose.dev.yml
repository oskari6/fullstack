# docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
services:
  nginx:
    volumes:
      - ./nginx.dev.conf:/etc/nginx/nginx.conf:ro

  app:
    volumes:
      - ./backend:/usr/src/app
    build:
      context: ./backend
      dockerfile: Dockerfile.dev

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend:/usr/src/app
