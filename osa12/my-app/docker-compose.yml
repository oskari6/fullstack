services:
  nginx:
    container_name: reverse-proxy
    image: nginx:1.29
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - 8080:80
    depends_on:
      - app
      - web

  web:
    container_name: frontend
    image: frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      APP_URL: /api
      WS_URL: /ws

  app:
    container_name: backend
    image: backend
    build:
      context: ./backend
      dockerfile: Dockerfile
