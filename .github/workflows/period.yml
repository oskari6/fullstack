name: Periodic Health Check

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

jobs:
  health_check:
    runs-on: ubuntu-latest
    steps:
      - name: Check application health
        uses: jtalk/url-health-check-action@v5
        with:
          url: https://fs-pokedex-ancient-starlight-8495.fly.dev
          max-attempts: 3
          retry-delay: 5s
